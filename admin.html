<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Modération — Bivouac Nzilo</title>
<style>
body{margin:0;font:1rem/1.5 system-ui,sans-serif;background:#E8EEEA;color:#0E2F2C;padding:20px}
main{max-width:560px;margin:0 auto}
h1{font-size:1.6rem;margin:0 0 16px}
input,button{font:inherit;padding:12px 14px;min-height:48px}
input{width:100%;box-sizing:border-box;margin:4px 0 12px;border:1px solid #0E2F2C55}
button{border:0;background:#0E2F2C;color:#fff;font-weight:700;cursor:pointer;margin-right:8px}
button.no{background:#C62828}
button:disabled{opacity:.5}
article{background:#fff;padding:12px;margin:14px 0}
article img{width:100%;max-height:60vh;object-fit:contain;background:#0001;display:block;margin-bottom:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Modération des photos</h1>
  <p id="msg" role="status"></p>
  <form id="login">
    <label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit">Se connecter</button>
  </form>
  <section id="panel" hidden>
    <p><span id="who"></span></p>
    <button id="reload" type="button">Actualiser</button><button id="out" type="button" class="no">Se déconnecter</button>
    <div id="list"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const c = window.BIVOUAC_SUPABASE_CONFIG, db = supabase.createClient(c.url, c.anonKey);
const $ = s => document.querySelector(s), say = t => $("#msg").textContent = t;
const view = on => { $("#login").hidden = on; $("#panel").hidden = !on; };

async function start() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return view(false);
  const { data: ok } = await db.rpc("is_admin");
  if (!ok) { say("Ce compte n'est pas administrateur."); await db.auth.signOut(); return view(false); }
  $("#who").textContent = session.user.email;
  view(true); load();
}

function button(label, cls, fn) {
  const b = document.createElement("button");
  b.textContent = label; b.className = cls;
  b.onclick = async () => {
    const all = b.parentNode.querySelectorAll("button"); all.forEach(x => x.disabled = true);
    try { await fn(); } catch (e) { say("Erreur : " + (e.message || e)); all.forEach(x => x.disabled = false); }
  };
  return b;
}

async function load() {
  const { data, error } = await db.from("photo_submissions").select("*").eq("status", "pending").order("created_at");
  const L = $("#list"); L.replaceChildren();
  if (error) return say("Erreur : " + error.message);
  say(data.length ? `${data.length} photo(s) en attente.` : "Aucune photo en attente.");
  for (const p of data) {
    const { data: s } = await db.storage.from("photos-pending").createSignedUrl(p.path, 3600);
    const d = document.createElement("article"), img = new Image(), t = document.createElement("p");
    img.src = s?.signedUrl || ""; img.alt = "";
    t.textContent = `${p.author || "Anonyme"}${p.caption ? " : " + p.caption : ""}`;
    d.append(img, t, button("Publier", "", () => publish(p, d)), button("Refuser", "no", () => reject(p, d)));
    L.append(d);
  }
}

async function publish(p, d) {
  const dl = await db.storage.from("photos-pending").download(p.path); if (dl.error) throw dl.error;
  const up = await db.storage.from("photos-public").upload(p.path, dl.data, { contentType: "image/jpeg", upsert: true }); if (up.error) throw up.error;
  const st = await db.from("photo_submissions").update({ status: "published" }).eq("id", p.id); if (st.error) throw st.error;
  await db.storage.from("photos-pending").remove([p.path]);
  d.remove();
}
async function reject(p, d) {
  const st = await db.from("photo_submissions").update({ status: "rejected" }).eq("id", p.id); if (st.error) throw st.error;
  await db.storage.from("photos-pending").remove([p.path]);
  d.remove();
}

$("#login").addEventListener("submit", async e => {
  e.preventDefault();
  const { error } = await db.auth.signInWithPassword({ email: $("#em").value, password: $("#pw").value });
  if (error) return say("Connexion refusée : " + error.message);
  say(""); start();
});
$("#out").onclick = async () => { await db.auth.signOut(); say(""); view(false); };
$("#reload").onclick = load;
start();
</script>
</body>
</html>
